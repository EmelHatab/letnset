{% extends "layout.html" %}

{% block title %}Ilmoituksen muokkaus{% endblock %}

{% block content %}
<body>
    <div class="edit-form form-section">
      <form action="/edit/{{ location.id }}" method="post" enctype="multipart/form-data">
        <div class="form-group">
          <label for="name">Otsikko</label>
          <input type="text" id="name" name="name" required value="{{ location.name }}" />
          <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
        </div>
        <div class="form-group">
          <label for="description">Kuvaus</label>
          <textarea id="description" name="description" required>{{ location.description }}</textarea>
        </div>
        <div class="form-group">
          <label for="image">Kuva</label>
          <input type="file" id="image" name="image" accept="image/*" />
        </div>
        <button type="submit" class="submit-btn">Tallenna muutokset</button>
        <a href="/location/{{ location.id }}" class="submit-btn">Peruuta</a>
      </form>
    </div>
  </div>
</body>

{% endblock %}
