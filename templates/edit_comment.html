{% extends "layout.html" %}
{% block title %}Kommentin muokkaus{% endblock %}
{% block content %}

 <form action="/edit_comment/{{ comment.id }}" method="post">
    <p>
      Viesti:<br />
      <textarea name="content" rows="5" cols="40">{{ comment.content }}</textarea>
    </p>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" class="submit-btn" value="Lähetä" />
    <a href="/location/{{ comment.location_id }}" class="submit-btn">Peruuta</a>
  </form>

{% endblock %}
