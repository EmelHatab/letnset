{% extends "layout.html" %}
{% block title %}Kirjaudu sisään{% endblock %}
{% block content %}

<body>
  <div class="container">
    <div class="auth-container">
      <form action="/login" method="post">
        <div class="form-group">
          <label for="username">Tunnus</label>
          <input type="text" id="username" name="username" value="{% if username %}{{ username }}{% else %}{{ '' }}{% endif %}" required />
        </div>
        <div class="form-group">
          <label for="password">Salasana</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="submit-btn" style="width: 100%;">Kirjaudu</button>
      </form>
      <div class="auth-links">
        <p>Eikö tunnusta? <a href="/register">Luo uusi</a></p>
        <p><a href="/">Etusivulle</a></p>
      </div>
    </div>
  </div>
</body>

{% endblock %}
