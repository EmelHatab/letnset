{% extends "layout.html" %}

{% block title %} {{ user.username }} - profiilin muokkaus{% endblock %}

{% block content %}
<body>
    <div class="edit-form form-section">
      <form action="/profile/{{ user.username }}/edit" method="post" enctype="multipart/form-data">
        <div class="form-group">
          <label for="username">Käyttäjänimi</label>
          <input type="text" id="username" name="username" value="{{ user.username }}" />
          <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
        </div>
        <div class="form-group">
          <label for="password">Salasana</label>
          <input type="password" id="password" name="password" />
          <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
        </div>
        <div class="form-group">
          <label for="image">Kuva</label>
          <input type="file" id="image" name="image" accept="image/*" />
        </div>
        <button type="submit" class="submit-btn">💾 Tallenna muutokset</button>
      </form>
    </div>
  </div>
</body>

{% endblock %}
