{% extends "layout.html" %}
{% block title %}Rekisteröityminen{% endblock %}
{% block content %}

<body>
  <div class="container">
    <div class="auth-container">
      <h1>✨ Luo uusi tunnus</h1>
      
      <form action="/create" method="post" enctype="multipart/form-data">
        <div class="form-group">
          <label for="username">Tunnus</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="password1">Salasana</label>
          <input type="password" id="password1" name="password1" required />
        </div>
        <div class="form-group">
          <label for="password2">Salasana uudestaan</label>
          <input type="password" id="password2" name="password2" required />
        </div>
        <div class="form-group">
          <label for="image">Profiilikuva</label>
          <input type="file" id="image" name="image" accept="image/*" />
        </div>
        <button type="submit" class="submit-btn" style="width: 100%;">Luo tunnus</button>
      </form>
      <div class="auth-links">
        <p>Onko tunnusta jo? <a href="/login">Kirjaudu</a></p>
        <p><a href="/">← Etusivulle</a></p>
      </div>
    </div>
  </div>
</body>

{% endblock %}
